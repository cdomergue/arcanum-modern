name: Release packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build git python3 binutils unzip \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxinerama-dev libxcursor-dev \
            libasound2-dev libpulse-dev libxss-dev libxtst-dev libxfixes-dev libxkbcommon-dev libudev-dev
      - name: Check tactical camera and input handling
        run: |
          bash ./prepare-source.sh
          python3 tests/test_tactical_camera.py
          python3 tests/test_keyboard_capture.py
          python3 tests/test_combat_binding.py
          python3 tests/test_combat_exit.py
          python3 tests/test_map_route.py
          python3 tests/test_world_route.py
          python3 tests/test_crash_report.py
          python3 tests/test_line_clipping.py
          python3 tests/test_ce_text.py
          python3 tests/test_ce_waiting.py
          python3 tests/test_ce_reaction.py
          python3 tests/test_ce_spell_cost.py
          python3 tests/test_ce_running.py
          python3 tests/test_ce_stun.py
          python3 tests/test_camera_keys.py
          python3 tests/test_qol_preferences.py
          python3 tests/test_tactical_combat.py
          python3 tests/test_shared_turns.py
          python3 tests/test_party_combat.py
          python3 tests/test_hotkey_assignment.py
          python3 tests/test_party_hotkeys.py
          python3 tests/test_inventory_transfer_all.py
          python3 tests/test_combat_music.py
          python3 tests/test_hud_messages.py
          python3 tests/test_party_grouping.py
          python3 tests/test_follower_roster.py
          python3 tests/test_party_transitions.py
          python3 tests/test_uap_compat.py
          python3 tests/test_module_repositories.py
          python3 tests/test_ui_localization.py
          python3 tests/test_autosave.py
          python3 tests/test_save_diagnostics.py
          python3 tests/test_save_rename.py
          python3 tests/test_auto_level_schemes.py
          python3 tests/test_sheet_navigation.py
          python3 tests/test_sheet_labels.py
          python3 tests/test_map_camera.py
          python3 tests/test_map_cache_residency.py
          python3 tests/test_map_fog.py
          python3 tests/test_map_local_input.py
          python3 tests/test_map_travel.py
          python3 tests/test_combat_feedback.py
      - name: Build and package Linux x64
        env:
          ARCANUM_BUILD_DIR: build/linux-x64
        run: |
          python3 tests/test_linux_package.py
          python3 tests/test_house_catalog.py
          ./build.sh
          cmake --build build/linux-x64 --target check-name-input
          build/linux-x64/check-name-input
          python3 tools/package-linux.py --exe build/linux-x64/arcanum-ce --build-dir build/linux-x64
          python3 tests/test_linux_package.py dist/ArcanumModern-linux-x64.zip
          python3 tests/test_dependency_source_packages.py dist/ArcanumModern-linux-x64.zip dist/ArcanumModern-dependency-sources-linux-x64.zip
          RENAISSANCE_LAUNCHER_PACKAGE="$PWD/dist/ArcanumModern-linux-x64.zip" build/launcher/launcher-tests-linux
          python3 tests/test_launcher_ui.py build/linux-x64/renaissance-launcher-ui
      - name: Check extracted runtime
        run: |
          mkdir "$RUNNER_TEMP/linux-package"
          unzip -q dist/ArcanumModern-linux-x64.zip -d "$RUNNER_TEMP/linux-package"
          cd "$RUNNER_TEMP/linux-package"
          test -x arcanum-modern
          test -x "Play Arcanum Renaissance.sh"
          ldd ./arcanum-modern > dependencies.txt
          cat dependencies.txt
          if grep -q 'not found' dependencies.txt; then exit 1; fi
          ./arcanum-modern --check-movies
          if ./"Play Arcanum Renaissance.sh" 2> missing-game.txt; then exit 1; fi
          grep -q arcanum1.dat missing-game.txt
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: linux-release
          path: |
            dist/ArcanumModern-linux-x64.zip
            dist/ArcanumModern-dependency-sources-linux-x64.zip
          if-no-files-found: error

  windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Test package boundaries
        run: |
          python3 tests/test_windows_full_package.py
          python3 tests/test_windows_setup.py
          python3 tests/test_ffmpeg_download.py
          python3 tests/test_dependency_source_packages.py
      - name: Build Windows ZIP
        run: |
          docker run --rm \
            --mount "type=bind,source=$PWD,target=/work" --workdir /work \
            -e LLVM_MINGW=/opt/llvm-mingw \
            mstorsjo/llvm-mingw:latest bash ./build-windows.sh
          docker run --rm \
            --mount "type=bind,source=$PWD,target=/work" --workdir /work \
            -e LLVM_MINGW=/opt/llvm-mingw \
            mstorsjo/llvm-mingw:latest cmake --build build/windows-x64 --target check-utf8-files check-name-input worlded-native-inventory
      - name: Build setup and verify ZIP
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis
          sudo chown -R "$(id -u):$(id -g)" dist
          python3 tests/test_windows_package.py
          python3 tests/test_dependency_source_packages.py dist/ArcanumModern-windows-x64.zip dist/ArcanumModern-dependency-sources-windows-x64.zip
          python3 tools/package-windows-setup.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: worlded-native-runtime
          path: build/windows-x64/worlded-native-inventory.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-checks
          path: |
            build/windows-x64/check-utf8-files.exe
            build/windows-x64/check-name-input.exe
            build/launcher/launcher-tests.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-release
          path: |
            dist/ArcanumModern-windows-x64.zip
            dist/ArcanumModern-windows-x64-setup.exe
            dist/ArcanumModern-dependency-sources-windows-x64.zip
          if-no-files-found: error

  worlded-windows:
    needs: windows
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - name: Install zlib
        run: vcpkg install zlib:x64-windows
      - name: Build and test WorldED
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          cmake -S tools/worlded -B build/worlded-release -DWORLDED_BUILD_GUI=ON "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows
          if ($LASTEXITCODE) { throw 'WorldED configure failed' }
          cmake --build build/worlded-release --config Release --parallel 4
          if ($LASTEXITCODE) { throw 'WorldED build failed' }
          ctest --test-dir build/worlded-release -C Release --output-on-failure
          if ($LASTEXITCODE) { throw 'WorldED tests failed' }
      - uses: actions/download-artifact@v8.0.2
        with:
          name: worlded-native-runtime
          path: build/worlded-native-runtime
      - uses: actions/download-artifact@v8.0.2
        with:
          name: windows-release
          path: dist/engine
      - name: Package editor and offline tutorial
        shell: pwsh
        run: |
          python tests/test_worlded_windows_package.py
          if ($LASTEXITCODE) { throw 'WorldED packaging tests failed' }
          $runtimeDlls = @(Get-ChildItem "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin" -Filter '*.dll')
          if (!$runtimeDlls.Count) { throw 'No Release runtime DLLs found in the vcpkg installation' }
          $runtimeArgs = @()
          foreach ($dll in $runtimeDlls) { $runtimeArgs += @('--extra-dll', $dll.FullName) }
          python tools/package-worlded-windows.py --build-dir build/worlded-release --inventory-helper build/worlded-native-runtime/worlded-native-inventory.exe --engine-package dist/engine/ArcanumModern-windows-x64.zip --qt-bin "$env:QT_ROOT_DIR/bin" @runtimeArgs --smoke-test
          if ($LASTEXITCODE) { throw 'WorldED package verification failed' }
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: worlded-release
          path: dist/worlded-renaissance-win.zip
          if-no-files-found: error

  script-editor-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
      - name: Install build and desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zlib1g-dev libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 libxcb-render-util0
      - name: Build and test script editor
        run: |
          cmake -S tools/worlded -B build/script-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DWORLDED_BUILD_GUI=ON
          cmake --build build/script-release --target script-editor script-editor-check --parallel 4
          ctest --test-dir build/script-release -R '^script_editor' --output-on-failure

  windows-install:
    needs: windows
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Test local Windows crash reports
        shell: pwsh
        run: |
          python tests/test_crash_report.py
          if ($LASTEXITCODE) { throw 'Crash reporting tests failed' }
      - uses: actions/download-artifact@v8.0.2
        with:
          name: windows-release
          path: dist
      - name: Test installation and removal on Windows
        shell: pwsh
        run: ./tests/test-windows-setup.ps1 -Setup ./dist/ArcanumModern-windows-x64-setup.exe
      - uses: actions/download-artifact@v8.0.2
        with:
          name: windows-checks
          path: checks
      - name: Test accented Windows paths
        shell: pwsh
        run: |
          ./checks/windows-x64/check-utf8-files.exe "$env:RUNNER_TEMP/Arcanum paths"
          if ($LASTEXITCODE -ne 0) { throw "UTF-8 file test failed: $LASTEXITCODE" }
      - name: Test character and save names on Windows
        shell: pwsh
        run: |
          ./checks/windows-x64/check-name-input.exe
          if ($LASTEXITCODE -ne 0) { throw "Name input test failed: $LASTEXITCODE" }
      - name: Check packaged movie decoder on Windows
        shell: pwsh
        run: |
          Expand-Archive ./dist/ArcanumModern-windows-x64.zip "$env:RUNNER_TEMP/movie-runtime"
          $process = Start-Process "$env:RUNNER_TEMP/movie-runtime/arcanum-modern.exe" -ArgumentList '--check-movies' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Movie decoder runtime failed: $($process.ExitCode)" }
      - name: Verify launcher updates, recovery and game startup
        shell: pwsh
        run: |
          $env:RENAISSANCE_LAUNCHER_BINARY = "$env:RUNNER_TEMP/movie-runtime/renaissance-launcher.exe"
          $env:RENAISSANCE_ENGINE_BINARY = "$env:RUNNER_TEMP/movie-runtime/arcanum-modern.exe"
          $env:RENAISSANCE_LAUNCHER_PACKAGE = (Resolve-Path ./dist/ArcanumModern-windows-x64.zip).Path
          ./checks/launcher/launcher-tests.exe '-test.v=true'
          if ($LASTEXITCODE -ne 0) { throw "Launcher regression tests failed: $LASTEXITCODE" }

  macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - run: bash ./build-macos.sh
      - name: Test character and save names
        run: |
          cmake --build build/macos-arm64 --target check-name-input
          build/macos-arm64/check-name-input
      - name: Check native map preparation
        run: |
          python3 tools/build-map-exporter.py --source tools/check-map-generation.c --name check-map-generation --exclude-object src/ui/modern_map_generator.c.o
          build/macos-arm64/check-map-generation "$(mktemp -d)"
          python3 tools/build-map-exporter.py --source tools/check-cursor-scale.c --name check-cursor-scale
          build/macos-arm64/check-cursor-scale
      - run: python3 tests/test_macos_package.py
      - name: Verify runtime and separate dependency sources
        run: python3 tests/test_dependency_source_packages.py dist/ArcanumModern-macos-arm64.zip dist/ArcanumModern-dependency-sources-macos-arm64.zip
      - name: Check macOS launcher and packaged update payload
        run: |
          RENAISSANCE_LAUNCHER_PACKAGE="$PWD/dist/ArcanumModern-macos-arm64.zip" build/launcher/launcher-tests-macos
          python3 tests/test_launcher_ui.py build/macos-arm64/renaissance-launcher-ui
      - name: Check packaged movie decoder on macOS
        run: |
          ditto -x -k dist/ArcanumModern-macos-arm64.zip "$RUNNER_TEMP/movie-runtime"
          "$RUNNER_TEMP/movie-runtime/Arcanum Modern.app/Contents/MacOS/Arcanum Community Edition" --check-movies
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: macos-release
          path: |
            dist/ArcanumModern-macos-arm64.zip
            dist/ArcanumModern-dependency-sources-macos-arm64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-install, worlded-windows, script-editor-linux, macos, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: '*-release'
          path: dist
          merge-multiple: true
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          files=(ArcanumModern-windows-x64.zip ArcanumModern-windows-x64-setup.exe ArcanumModern-macos-arm64.zip ArcanumModern-linux-x64.zip worlded-renaissance-win.zip ArcanumModern-dependency-sources-windows-x64.zip ArcanumModern-dependency-sources-macos-arm64.zip ArcanumModern-dependency-sources-linux-x64.zip)
          sha256sum "${files[@]}" > SHA256SUMS.txt
          if gh release view "$RELEASE_TAG" --json isDraft > release.json; then
            test "$(jq -r .isDraft release.json)" = true || { echo 'Refusing to replace a published release.' >&2; exit 1; }
            gh release upload "$RELEASE_TAG" "${files[@]}" SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" "${files[@]}" SHA256SUMS.txt \
              --verify-tag --draft --title "Arcanum Renaissance $RELEASE_TAG" --generate-notes
          fi
